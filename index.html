<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Best Repos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="cabecalho">
            <p class="dashboard"><i class="fa-solid fa-cube"></i>&nbsp; DashBoard ></p><p id="Repositorio_atual_cabecalho">Repositories</p>
        </div>
    </header>


    <aside class="menuSide">
        <div>
            <br><span class="starLogo"><⭐></span><span><b >My Best Repos</b></span><br><br><br>
        </div>
        <div>
            <div class="Searchs">
                <a href="index.html"><i class="fa-solid fa-magnifying-glass"></i> Search Repositories</a>
            </div>
            <div class="Searchs">
                <a href="favorites.html"><i class="fa-regular fa-star"></i> My favorites</a><span class="countOfFavorites"></span>
            </div>
            <div class="Searchs">
                <a href="profile.html"><i class="fa-solid fa-gear"></i> Profile</a>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="intro">
            <h1 class="titulo">Search GitHub Repositories</h1>
            <p class="descricao">Query millions of open-source projects, analyze health metrics, and bookmark your <br> favorites into your developer dashboard</p>
        </div>

        <div class="pai">
            <div class="input">
                <div class="containerSearch">
                    <i id="lupaDoSearch" class="fa-solid fa-magnifying-glass"></i>
                    <input class="inputRepositories" type="text" placeholder="Enter your repository here">
                </div>

                <div class="filtros">
                    <span class="Language">Language: </span>
                    <button class="buttonsFilterLanguage">All</button>
                    <button class="buttonsFilterLanguage">TypeScript</button>
                    <button class="buttonsFilterLanguage">Python</button>
                    <button class="buttonsFilterLanguage">Rust</button>
                    <button class="buttonsFilterLanguage">Go</button>
                    <div class="sortContainer">
                        <i class="fa-solid fa-sort"></i><span class="sortRepo">Sort:</span>
                        <span class="moststars">Most Stars</span>
                    </div>
                </div>
                
        </div>
    </main>
</body>
</html>
